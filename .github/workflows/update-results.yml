name: Atualizar resultados CAIXA
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_caixa.py'
      - '.github/workflows/update-results.yml'
permissions:
  contents: write
concurrency:
  group: update-caixa-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Consultar e validar resultados oficiais
        run: python scripts/update_caixa.py
      - name: Publicar espelho atualizado
        run: |
          if git diff --quiet -- data/results.json; then
            echo 'Nenhum resultado novo confirmado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/results.json
          git commit -m 'Atualiza resultados das Loterias CAIXA'
          git push
