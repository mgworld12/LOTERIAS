name: Atualizar resultados CAIXA
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_caixa.py"
      - ".github/workflows/update-results.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: update-caixa-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Roda em RODADAS CURTAS: ao fim de cada uma, grava, faz commit e republica o site.
      # Assim o app já fica utilizável (com os concursos mais recentes) na primeira rodada,
      # e o histórico antigo vai sendo completado sem esperar o fim de tudo.
      - name: Atualizar em rodadas e publicar a cada rodada
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND_SECONDS: "600"
          MAX_TOTAL_SECONDS: "19200"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          round=0
          while true; do
            round=$((round+1))
            left=$(( MAX_TOTAL_SECONDS - ($(date +%s) - start) ))
            [ "$left" -le 60 ] && echo "Limite de tempo do job; continua na próxima execução." && break
            budget=$(( left < ROUND_SECONDS ? left : ROUND_SECONDS ))
            echo "=== Rodada $round (até ${budget}s) ==="
            TIME_BUDGET_SECONDS=$budget python scripts/update_caixa.py || echo "Rodada terminou com erro (dados já gravados são mantidos)."
            if git status --porcelain -- data | grep -q .; then
              git add data
              git commit -m "Atualiza resultados das Loterias CAIXA (rodada $round)"
              git pull --rebase
              git push
              gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
            else
              echo "Sem mudanças nesta rodada: fim (histórico completo ou servidor sem novidades)."
              break
            fi
            status=$(python -c "import json;print(json.load(open(\"data/index.json\")).get(\"status\"))")
            [ "$status" = "ok" ] && echo "Histórico completo." && break
          done
