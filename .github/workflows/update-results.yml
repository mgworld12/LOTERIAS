name: Atualizar resultados CAIXA
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_caixa.py"
      - ".github/workflows/update-results.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: update-caixa-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Consultar e validar resultados oficiais
        run: python scripts/update_caixa.py
        continue-on-error: true
        timeout-minutes: 335
      - name: Publicar espelho atualizado
        id: commit
        if: always()
        run: |
          if git diff --quiet -- data/results.json; then
            echo "Nenhum resultado novo confirmado."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "Atualiza resultados das Loterias CAIXA"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republicar o site com os dados novos
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
